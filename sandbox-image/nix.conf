# nix.conf for the max-bot sandbox base image.
#
# Design: every sandbox container mounts the shared "max-nix" volume
# at /nix, so this store is written to by several single-user nix
# instances at once (safe: nix's local store is multi-process by
# design).  GC is therefore never automatic — it would race other
# containers' builds — and nixpkgs is pinned so containers don't
# chase the moving branch.

experimental-features = nix-command flakes

# Single-user mode (we run as root inside the container).
build-users-group =

# nix's own build sandbox needs privileges we don't grant the
# container; binary-cache substitution is unaffected.
sandbox = false

# Binary caches: TUNA mirror first, official cache as fallback.
# Both serve paths signed with the official key.
substituters = https://mirrors.tuna.tsinghua.edu.cn/nix-channels/store https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
fallback = true

# The Dockerfile pins nixpkgs (nixos-26.05 resolved to an exact rev)
# into /etc/nix/registry.json; pointing flake-registry at the same
# file stops nix fetching the online global registry.
flake-registry = /etc/nix/registry.json

# No automatic GC: min-free = 0 disables free-space-triggered GC
# during builds.  Reclaiming store space is an operator decision
# (`nix store gc` while no sandboxes are running).
min-free = 0
auto-optimise-store = false

# The pin is an immutable rev, but keep branch-ref tarballs cached
# forever too.
tarball-ttl = 4294967295
