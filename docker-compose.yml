services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: max-napcat
    # Image is multi-arch (linux/amd64 + linux/arm64); the runtime picks the
    # native variant. Pin explicitly only if you need to cross-test.
    restart: unless-stopped
    ports:
      - "6099:6099"    # NapCat web admin (configure reverse-WS here on first run)
    environment:
      ACCOUNT: "${NAPCAT_QQ:-0}"
      WSR_ENABLE: "true"
      WS_URLS: '["ws://host.docker.internal:8080/onebot"]'
      NAPCAT_ACCESS_TOKEN: "${MAX_ACCESS_TOKEN}"
    extra_hosts:
      # Allow NapCat (in container) to reach the Haskell bot on the dev host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.napcat/QQ:/app/.config/QQ
      - ./.napcat/napcat:/app/napcat/config
