[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Every direct dependency is declared here, once; crates refer to it with
# `workspace = true`. Adding one is its own commit with the reason in it.
[workspace.dependencies]
# max-core may use only these four; see the flake's max-core-deps check.
# The clock stays off so that the core can't read the time.
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Our own crates.
max-core = { path = "crates/max-core" }
max-db = { path = "crates/max-db" }
max-llm = { path = "crates/max-llm" }
qqbot = { path = "crates/qqbot" }

# Postgres for max-db: compile-time checked queries, migrations and
# #[sqlx::test]. Only the features we use; no TLS, the database is local.
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "macros",
  "migrate",
  "chrono",
  "json",
] }

# The async runtime: qqbot's gateway and REST calls, and running futures
# side by side in database tests.
tokio = "1.54"
# CancellationToken, which every Scope hands its tasks: cancelling a task
# without aborting it mid-await, and a whole subtree at once.
tokio-util = "0.7.20"

# HTTP for qqbot's REST calls and max-llm's model calls, streamed. Its
# default TLS is rustls with the system's roots.
reqwest = { version = "0.13", features = ["json", "stream"] }
# The gateway's WebSocket client, on the same rustls and system roots.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# Splits max-llm's model responses into server-sent events. Only that: the
# wire types are max-llm's own. 0.2.6 is the one rmcp uses.
sse-stream = "0.2.6"
# StreamExt and SinkExt, for the WebSocket stream.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Logging from library crates; max sets up the subscriber.
tracing = "0.1"
# The subscriber: max's logs, and qqbot's listen example, which shows
# sessions starting and reconnecting.
tracing-subscriber = "0.3"

# max's command line: subcommands and --config, nothing else.
clap = { version = "4.6", features = ["derive"] }
# max's configuration file, the one place settings come from.
toml = "1.1"
# Token estimates for everything the model is shown, so the core can size
# requests without a tokenizer of its own. One function in max uses it.
tiktoken-rs = "0.12.1"
# Reports for errors max can only stop on, at startup and on fatal paths.
# Errors a caller matches on are thiserror types instead.
color-eyre = "0.6.5"

# SSH to the groups' VMs, over cloud-hypervisor's hybrid vsock socket: one
# connection per VM, one channel per command. On aws-lc-rs, which rustls
# already brings; no RSA, no compression.
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs"] }
# The key max logs in to a VM with, made for each boot. The version russh
# uses.
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
# Max's MCP service, which programs in a VM call Max's tools through:
# Streamable HTTP on a unix socket per VM, stateless, JSON replies. rmcp
# does the protocol; axum serves it, and only that.
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# The content store names media by their SHA-256. 0.11 is in the tree
# already, through sqlx and russh.
sha2 = "0.11"
# What the model is sent of a picture: its size, and a smaller JPEG when
# the original is large. Only the four formats QQ sends; no rayon, so it
# keeps to the blocking thread it is given.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Pictures go to the model as data URLs. 0.23 is in the tree already,
# through reqwest and rmcp.
base64 = "0.23"

# Tests only.
insta = "1.49"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
