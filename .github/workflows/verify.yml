# verify/: that MaxCore/ is what ./extract makes of chunk.rs now, and that
# the proofs about it hold. Apart from ci.yml, and only when the chunker or
# verify/ changes: Charon and Aeneas are in no binary cache for the pinned
# revision, so the extract job fetches about 15 GB of Rust toolchains and
# builds the rest, and the lean job builds Aeneas's Lean library. chunk.rs
# uses only core and alloc, so nothing else in the repository changes what
# ./extract writes.
name: Verify

on:
  push:
    branches: [main, maxx]
    paths:
      - crates/max-core/src/segment/chunk.rs
      - verify/**
      - .github/workflows/verify.yml
  pull_request:
    paths:
      - crates/max-core/src/segment/chunk.rs
      - verify/**
      - .github/workflows/verify.yml

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Charon's toolchains don't fit in what the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Aeneas's cache, which has some of what Charon and Aeneas are built from.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=

      - run: verify/extract

      - name: MaxCore/ is what ./extract writes
        run: |
          git status --porcelain -- verify/MaxCore
          git diff --exit-code -- verify/MaxCore
          test -z "$(git status --porcelain -- verify/MaxCore)"

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: verify
    steps:
      - uses: actions/checkout@v4

      # The toolchain itself comes from lean-toolchain, at the first lake.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Mathlib built, rather than building it.
      - run: lake exe cache get

      - run: lake build
