# One job: the flake's checks, which are the same ones developers run with
# `nix flake check --impure` (fmt, clippy, nextest, deny, audit, machete,
# max-core's dependency allow list, max-core built alone, the package).
name: CI

on:
  push:
    branches: [main, maxx]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # devenv's binary cache — saves building the devenv machinery.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      # --impure: the dev shell is devenv as a flake module.
      - run: nix flake check --impure -L
