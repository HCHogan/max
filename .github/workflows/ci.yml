# Independent jobs cover the bot's two build paths and keep quality, unit, and
# PostgreSQL failures visible at the same time.
#
#   build-test  — build and quality checks through the same flake dev shell
#                 developers use
#                 (nix develop --impure; devenv-as-flake-module needs
#                 impure eval), so CI's GHC/toolchain pin is exactly
#                 flake.lock's.  Haskell deps are compiled by cabal
#                 inside the shell and cached across runs — the first
#                 run after a dependency bump is slow (~40 min), cached
#                 runs are minutes.
#   unit-test   — pure Haskell tests, independent of lint.
#   db-test     — PostgreSQL/pgvector migrations and integration tests,
#                 independent of both lint and unit failures.
#
#   nix-build   — the flake package, which is what nix/module.nix
#                 actually installs in production.
#
# The db-test job starts PostgreSQL with pgvector and requires the
# integration suite. Context/memory correctness lives in SQL boundaries,
# transactions, migrations, and cursors; skipping that suite is not safe.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Haskell process is not the whole deployment: iMessage and WeChat each
  # ship a small Go companion.  Exercise both their portable fallback and the
  # native platform implementation so build tags cannot hide a broken bridge.
  bridge-test:
    name: bridge-${{ matrix.bridge }}-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bridge: imsg
            os: ubuntu-latest
            directory: bridge/imsg
          - bridge: imsg
            os: macos-latest
            directory: bridge/imsg
          - bridge: wechat
            os: ubuntu-latest
            directory: bridge/wechat
          - bridge: wechat
            os: windows-latest
            directory: bridge/wechat
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: ${{ matrix.directory }}/go.mod

      - name: Test bridge
        working-directory: ${{ matrix.directory }}
        run: go test ./...

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # devenv's binary cache — saves building the devenv machinery.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          # Cover both layouts: classic ~/.cabal and XDG (state/cache).
          path: |
            ~/.cabal
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ runner.os }}-build-${{ hashFiles('flake.lock', 'max.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-build-
            cabal-${{ runner.os }}-

      - name: cabal update
        run: nix develop --impure -c cabal update

      - name: Build
        run: nix develop --impure -c cabal build all

      - name: Check architecture boundaries
        run: nix develop --impure -c python3 scripts/check-architecture.py

      - name: Check source distribution metadata
        run: nix develop --impure -c cabal check

      - name: Verify generated docs
        run: nix develop --impure -c cabal run max-prompt-flow -- --check

      # Zero hints is the committed state; .hlint.yaml records both the
      # language settings hlint needs to parse this codebase and the hint
      # classes we deliberately decline.
      - name: Lint
        run: >-
          nix develop --impure -c hlint
          src app maintenance test test-db prompt-flow eval context-eval

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ runner.os }}-unit-${{ hashFiles('flake.lock', 'max.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-unit-
            cabal-${{ runner.os }}-

      - name: cabal update
        run: nix develop --impure -c cabal update

      - name: Test
        run: nix develop --impure -c cabal test max-test --test-show-details=direct

  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: max_test
          POSTGRES_PASSWORD: max_test
          POSTGRES_DB: max_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U max_test -d max_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ runner.os }}-db-${{ hashFiles('flake.lock', 'max.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-db-
            cabal-${{ runner.os }}-

      - name: cabal update
        run: nix develop --impure -c cabal update

      - name: Test PostgreSQL integration
        run: nix develop --impure -c cabal test max-test-db --test-show-details=direct
        env:
          MAX_TEST_DB_URL: postgresql://max_test:max_test@127.0.0.1:5432/max_test

      - name: Test populated task upgrade
        # devenv sets PGPORT for its local database; apply the CI connection
        # after entering the shell so the service container remains authoritative.
        run: nix develop --impure -c env PGHOST=127.0.0.1 PGPORT=5432 PGUSER=max_test bash scripts/test-task-upgrade.sh
        env:
          PGPASSWORD: max_test

      - name: Verify database and operational health gate
        run: nix develop --impure -c env MAX_DB_URL=postgresql://max_test:max_test@127.0.0.1:5432/max_test cabal run max-adr003-maintenance -- verify

  # The deployment path nothing else covered.  build-test compiles with
  # cabal against the devenv toolchain; nix/module.nix installs
  # packages.max, which resolves its dependencies through nixpkgs'
  # haskellPackages plus the overrides in flake.nix — a callHackageDirect
  # pin for opt-env-conf, markUnbroken + doJailbreak for wreq-effectful.
  # Those go stale silently on a nixpkgs bump, and without this job the
  # first sign would be a failed deploy.
  #
  # Cheap enough to run on every push: the dep closure comes from
  # cache.nixos.org, so only max itself compiles (~30s locally).  No
  # --impure here — only the dev shell needs devenv's impure eval, the
  # package builds pure.
  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build the flake package
        run: nix build .#max --print-out-paths
